<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HaxBall Analytics LIVE</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background:
        radial-gradient(
            circle at top,
            #202631,
            #0c0f14 70%
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

header {

    height: 70px;

    background: #151922;

    border-bottom:
        1px solid #2b303b;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 25px;
}

.logo {

    font-size: 22px;

    font-weight: bold;
}

.live {

    color: #4cff68;

    font-weight: bold;
}

main {

    width: 100%;

    max-width: 1100px;

    margin: auto;

    padding: 20px;
}

.card {

    background: #151922;

    border:
        1px solid #2b303b;

    border-radius: 12px;

    padding: 18px;

    margin-bottom: 18px;
}

.score {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 35px;

    font-size: 45px;

    font-weight: bold;
}

.team {

    text-align: center;

    font-size: 14px;

    color: #9fa6b3;
}

.time {

    text-align: center;

    color: #aeb4c0;

    margin-top: 5px;
}

.field {

    position: relative;

    width: 100%;

    height: 430px;

    overflow: hidden;

    border:
        3px solid white;

    border-radius: 8px;

    background: #24833f;
}

.center-line {

    position: absolute;

    left: 50%;

    top: 0;

    height: 100%;

    border-left:
        2px solid
        rgba(255,255,255,.6);
}

.ball {

    position: absolute;

    width: 15px;

    height: 15px;

    background: white;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    box-shadow:
        0 0 10px white;
}

.players {

    width: 100%;

    border-collapse: collapse;
}

.players th,
.players td {

    text-align: left;

    padding: 10px;

    border-bottom:
        1px solid #292e38;
}

.players th {

    color: #9fa6b3;

    font-size: 13px;
}

.event {

    margin-top: 15px;

    color: #cfd4dc;
}

.status-box {

    display: flex;

    justify-content: space-between;

    padding: 10px 0;

    color: #aeb4c0;
}

</style>

</head>

<body>

<header>

<div class="logo">
⚽ HaxBall Analytics
</div>

<div id="connection" class="live">
● CONECTANDO
</div>

</header>


<main>


<div class="card">

<div class="team">
RED &nbsp; VS &nbsp; BLUE
</div>

<div id="score" class="score">
0 × 0
</div>

<div id="time" class="time">
00:00
</div>

</div>


<div class="card">

<div
    id="field"
    class="field"
>

<div class="center-line"></div>

<div
    id="ball"
    class="ball"
></div>

</div>

</div>


<div class="card">

<h3>
👥 Jogadores
</h3>

<table class="players">

<thead>

<tr>

<th>
Nome
</th>

<th>
Time
</th>

<th>
ID
</th>

</tr>

</thead>

<tbody id="players">

</tbody>

</table>

<div
    id="event"
    class="event"
>
Aguardando dados...
</div>

</div>


<div class="card">

<div class="status-box">

<span>
Status da partida
</span>

<strong id="gameState">
AGUARDANDO
</strong>

</div>

<div class="status-box">

<span>
Jogadores
</span>

<strong id="playerCount">
0
</strong>

</div>

</div>


</main>


<script>

const connection =
    document.getElementById("connection");

const score =
    document.getElementById("score");

const time =
    document.getElementById("time");

const players =
    document.getElementById("players");

const eventText =
    document.getElementById("event");

const gameState =
    document.getElementById("gameState");

const playerCount =
    document.getElementById("playerCount");

const ball =
    document.getElementById("ball");


function formatTime(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(seconds || 0)
        );

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(secs).padStart(2, "0")
    );
}


function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function updateBall(x, y) {

    /*
      Conversão aproximada das coordenadas
      do estádio Big para a tela.
    */

    const left =
        ((x + 1500) / 3000) * 100;

    const top =
        ((y + 600) / 1200) * 100;

    ball.style.left =
        Math.max(0, Math.min(100, left))
        + "%";

    ball.style.top =
        Math.max(0, Math.min(100, top))
        + "%";
}


function render(data) {

    connection.textContent =
        data.connected
            ? "● LIVE"
            : "● OFFLINE";

    score.textContent =
        `${data.score.red || 0} × ${data.score.blue || 0}`;

    time.textContent =
        formatTime(data.game.time);

    gameState.textContent =
        data.game.state === "playing"
            ? "JOGANDO"
            : "AGUARDANDO";

    playerCount.textContent =
        data.players.length;

    eventText.textContent =
        data.lastEvent || "";

    players.innerHTML = "";

    for (const player of data.players) {

        const row =
            document.createElement("tr");

        let team = "SPECTATOR";

        if (player.team === 1) {
            team = "RED";
        }

        if (player.team === 2) {
            team = "BLUE";
        }

        row.innerHTML = `
            <td>
                ${escapeHTML(player.name)}
            </td>

            <td>
                ${team}
            </td>

            <td>
                ${player.id}
            </td>
        `;

        players.appendChild(row);
    }

    updateBall(
        data.ball.x,
        data.ball.y
    );
}


const protocol =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";


const websocket =
    new WebSocket(
        `${protocol}//${location.host}/ws`
    );


websocket.onopen =
    function () {

        connection.textContent =
            "● LIVE";

    };


websocket.onclose =
    function () {

        connection.textContent =
            "● OFFLINE";

    };


websocket.onerror =
    function () {

        connection.textContent =
            "● ERRO";

    };


websocket.onmessage =
    function (event) {

        try {

            const data =
                JSON.parse(event.data);

            render(data);

        } catch (error) {

            console.error(
                "Erro nos dados:",
                error
            );

        }

    };

</script>

</body>

</html>
