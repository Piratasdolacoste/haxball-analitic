<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HaxBall Analytics</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0f14;
      color: #ffffff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    header {
      padding: 20px;
      background: #111820;
      border-bottom: 1px solid #26313d;
    }

    header h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
    }

    #connection {
      font-size: 14px;
      color: #ff5555;
    }

    .online {
      color: #55ff88 !important;
    }

    .container {
      max-width: 1300px;
      margin: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));

      gap: 15px;
    }

    .card {
      background: #111820;
      border: 1px solid #26313d;
      border-radius: 12px;
      padding: 18px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 16px;
      color: #aab6c4;
    }

    .score {
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 44px;
      font-weight: bold;
    }

    .red {
      color: #ff5555;
    }

    .blue {
      color: #5599ff;
    }

    .timer {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin-top: 12px;
    }

    .status {
      font-size: 18px;
      font-weight: bold;
    }

    .field-wrapper {
      margin-top: 20px;
    }

    #field {
      position: relative;
      width: 100%;
      max-width: 1000px;
      height: 520px;
      margin: auto;

      background:
        repeating-linear-gradient(
          90deg,
          #24733e 0px,
          #24733e 50px,
          #287d44 50px,
          #287d44 100px
        );

      border: 5px solid #ffffff;
      border-radius: 8px;

      overflow: hidden;
    }

    .center-line {
      position: absolute;

      left: 50%;
      top: 0;

      width: 3px;
      height: 100%;

      background: rgba(255,255,255,0.8);

      transform: translateX(-50%);
    }

    .center-circle {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 130px;
      height: 130px;

      border: 3px solid rgba(255,255,255,0.8);

      border-radius: 50%;

      transform:
        translate(-50%, -50%);
    }

    .ball {
      position: absolute;

      width: 16px;
      height: 16px;

      background: #ffffff;

      border-radius: 50%;

      transform:
        translate(-50%, -50%);

      box-shadow:
        0 0 8px rgba(255,255,255,0.9);
    }

    .player-dot {
      position: absolute;

      width: 24px;
      height: 24px;

      border-radius: 50%;

      border: 2px solid #ffffff;

      transform:
        translate(-50%, -50%);

      font-size: 9px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: bold;
    }

    .red-player {
      background: #d83a3a;
    }

    .blue-player {
      background: #377de8;
    }

    .spec-player {
      background: #777777;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 10px;

      border-bottom:
        1px solid #26313d;
    }

    th {
      color: #9da9b6;
      font-size: 13px;
    }

    .event {
      margin-top: 10px;

      padding: 12px;

      background: #0c1117;

      border-radius: 8px;

      color: #dbe3ec;
    }

    .room-link {
      display: inline-block;

      margin-top: 10px;

      padding: 10px 14px;

      border-radius: 7px;

      background: #2875e6;

      color: white;

      text-decoration: none;
    }

    .room-link:hover {
      background: #3d86ef;
    }

    .empty {
      color: #7f8a96;

      padding: 15px 0;
    }

    @media (max-width: 700px) {

      #field {
        height: 300px;
      }

      .score {
        font-size: 34px;
      }

    }

  </style>

</head>

<body>

<header>

  <h1>⚽ HaxBall Analytics</h1>

  <div id="connection">
    ● Desconectado do servidor
  </div>

</header>

<div class="container">

  <div class="grid">

    <div class="card">

      <h2>SALA</h2>

      <div
        id="roomName"
        class="status"
      >
        Aguardando...
      </div>

      <a
        id="roomLink"
        class="room-link"
        href="#"
        target="_blank"
        style="display:none"
      >
        Entrar na sala
      </a>

    </div>

    <div class="card">

      <h2>PLACAR</h2>

      <div class="score">

        <span
          id="redScore"
          class="red"
        >
          0
        </span>

        <span>
          ×
        </span>

        <span
          id="blueScore"
          class="blue"
        >
          0
        </span>

      </div>

      <div
        id="timer"
        class="timer"
      >
        00:00
      </div>

    </div>

    <div class="card">

      <h2>PARTIDA</h2>

      <div
        id="gameState"
        class="status"
      >
        Aguardando
      </div>

      <div class="event">

        Último evento:

        <strong id="lastEvent">
          Aguardando Headless...
        </strong>

      </div>

    </div>

    <div class="card">

      <h2>JOGADORES</h2>

      <div
        id="playerCount"
        class="status"
      >
        0 jogadores
      </div>

    </div>

  </div>

  <div class="card field-wrapper">

    <h2>CAMPO AO VIVO</h2>

    <div id="field">

      <div class="center-line"></div>

      <div class="center-circle"></div>

      <div
        id="ball"
        class="ball"
      ></div>

      <div id="playersVisual"></div>

    </div>

  </div>

  <div class="card" style="margin-top:20px">

    <h2>JOGADORES NA SALA</h2>

    <table>

      <thead>

        <tr>

          <th>ID</th>

          <th>Nome</th>

          <th>Time</th>

          <th>Admin</th>

        </tr>

      </thead>

      <tbody id="playersTable">

        <tr>
          <td colspan="4" class="empty">
            Nenhum jogador conectado.
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>

<script>

  /*
  ==================================================
  CONFIGURAÇÃO
  ==================================================
  */

  const connectionElement =
    document.getElementById("connection");

  const roomNameElement =
    document.getElementById("roomName");

  const roomLinkElement =
    document.getElementById("roomLink");

  const redScoreElement =
    document.getElementById("redScore");

  const blueScoreElement =
    document.getElementById("blueScore");

  const timerElement =
    document.getElementById("timer");

  const gameStateElement =
    document.getElementById("gameState");

  const lastEventElement =
    document.getElementById("lastEvent");

  const playerCountElement =
    document.getElementById("playerCount");

  const playersTable =
    document.getElementById("playersTable");

  const field =
    document.getElementById("field");

  const ball =
    document.getElementById("ball");

  const playersVisual =
    document.getElementById("playersVisual");

  /*
  ==================================================
  CONVERTER TEMPO
  ==================================================
  */

  function formatTime(seconds) {

    seconds =
      Math.max(
        0,
        Math.floor(Number(seconds) || 0)
      );

    const minutes =
      Math.floor(seconds / 60);

    const secs =
      seconds % 60;

    return (
      String(minutes).padStart(2, "0") +
      ":" +
      String(secs).padStart(2, "0")
    );
  }

  /*
  ==================================================
  ATUALIZAR CAMPO
  ==================================================
  */

  function updateField(data) {

    /*
    Coordenadas aproximadas do Big Stadium.
    */

    const FIELD_WIDTH = 2000;
    const FIELD_HEIGHT = 1000;

    const width =
      field.clientWidth;

    const height =
      field.clientHeight;

    /*
    BALL
    */

    if (data.ball) {

      let x =
        ((Number(data.ball.x) + 1000)
        / FIELD_WIDTH) * width;

      let y =
        ((Number(data.ball.y) + 500)
        / FIELD_HEIGHT) * height;

      x =
        Math.max(
          0,
          Math.min(width, x)
        );

      y =
        Math.max(
          0,
          Math.min(height, y)
        );

      ball.style.left =
        x + "px";

      ball.style.top =
        y + "px";
    }

    /*
    PLAYERS
    */

    playersVisual.innerHTML = "";

    /*
    O estado atual contém apenas informações
    de jogador. A posição individual dos jogadores
    será adicionada na próxima versão do host.
    */

  }

  /*
  ==================================================
  ATUALIZAR TABELA
  ==================================================
  */

  function updatePlayers(players) {

    if (!Array.isArray(players)) {
      players = [];
    }

    playerCountElement.textContent =
      players.length +
      (
        players.length === 1
          ? " jogador"
          : " jogadores"
      );

    if (players.length === 0) {

      playersTable.innerHTML = `
        <tr>
          <td
            colspan="4"
            class="empty"
          >
            Nenhum jogador conectado.
          </td>
        </tr>
      `;

      return;
    }

    playersTable.innerHTML =
      players
        .map(function(player) {

          let team =
            "Spectator";

          let teamClass = "";

          if (player.team === 1) {
            team = "RED";
            teamClass = "red";
          }

          if (player.team === 2) {
            team = "BLUE";
            teamClass = "blue";
          }

          return `
            <tr>

              <td>
                ${player.id ?? "-"}
              </td>

              <td>
                ${escapeHtml(
                  player.name ?? "?"
                )}
              </td>

              <td class="${teamClass}">
                ${team}
              </td>

              <td>
                ${player.admin ? "✓" : ""}
              </td>

            </tr>
          `;

        })
        .join("");
  }

  /*
  ==================================================
  ESCAPE HTML
  ==================================================
  */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

  /*
  ==================================================
  RECEBER ESTADO
  ==================================================
  */

  function updateDashboard(data) {

    if (!data) {
      return;
    }

    /*
    CONEXÃO
    */

    if (data.connected) {

      connectionElement.textContent =
        "● Headless conectado";

      connectionElement.classList.add(
        "online"
      );

    } else {

      connectionElement.textContent =
        "● Headless desconectado";

      connectionElement.classList.remove(
        "online"
      );
    }

    /*
    SALA
    */

    roomNameElement.textContent =
      data.roomName ||
      "Analytics Test Room";

    if (data.roomLink) {

      roomLinkElement.href =
        data.roomLink;

      roomLinkElement.style.display =
        "inline-block";

    } else {

      roomLinkElement.style.display =
        "none";
    }

    /*
    SCORE
    */

    const score =
      data.score || {};

    redScoreElement.textContent =
      score.red ?? 0;

    blueScoreElement.textContent =
      score.blue ?? 0;

    timerElement.textContent =
      formatTime(score.time);

    /*
    GAME
    */

    if (
      data.game &&
      data.game.state === "playing"
    ) {

      gameStateElement.textContent =
        "🟢 Em andamento";

    } else {

      gameStateElement.textContent =
        "⚪ Aguardando";
    }

    /*
    EVENT
    */

    lastEventElement.textContent =
      data.lastEvent ||
      "Nenhum evento.";

    /*
    PLAYERS
    */

    updatePlayers(
      data.players || []
    );

    /*
    FIELD
    */

    updateField(data);
  }

  /*
  ==================================================
  WEBSOCKET
  ==================================================
  */

  let socket = null;

  let reconnectDelay = 1000;

  function connect() {

    const protocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    const url =
      protocol +
      "//" +
      location.host +
      "/ws";

    console.log(
      "Conectando:",
      url
    );

    socket =
      new WebSocket(url);

    socket.onopen = function() {

      console.log(
        "Dashboard conectado."
      );

      reconnectDelay = 1000;

    };

    socket.onmessage = function(event) {

      try {

        const data =
          JSON.parse(event.data);

        updateDashboard(data);

      } catch (error) {

        console.error(
          "JSON inválido:",
          error
        );

      }

    };

    socket.onclose = function() {

      console.log(
        "Dashboard desconectado."
      );

      connectionElement.textContent =
        "● Reconectando...";

      connectionElement.classList.remove(
        "online"
      );

      setTimeout(
        connect,
        reconnectDelay
      );

      reconnectDelay =
        Math.min(
          reconnectDelay * 2,
          10000
        );

    };

    socket.onerror = function(error) {

      console.error(
        "WebSocket error:",
        error
      );

    };
  }

  /*
  ==================================================
  START
  ==================================================
  */

  connect();

</script>

</body>

</html>
